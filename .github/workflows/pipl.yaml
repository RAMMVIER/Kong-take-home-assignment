name: Kong Gateway and Cypress Test Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v2

      # Set up Docker Compose (use the existing docker-compose.yml in the repo)
      - name: Set up Docker Compose
        run: |
          docker compose -f docker-compose.yml up -d

      # Wait for Kong to be ready
      - name: Wait for Kong to start
        run: |
          sleep 30  # Adjust this based on Kong's startup time, or add a more robust wait for health check

      # Install Cypress dependencies
      - name: Install Dependencies
        run: |
          npm ci

      # Run Cypress tests
      - name: Run Cypress tests
        run: |
          npx cypress run --spec "cypress/e2e/*.cy.js" --browser chrome

      # Clean up Kong and Postgres containers
      - name: Clean up Docker Containers
        run: |
          docker compose down
